# ============================================================
# Perfil de producción: PostgreSQL (Supabase) vía variables de entorno.
# Activar con: SPRING_PROFILES_ACTIVE=prod
#   (o -Dspring.profiles.active=prod, o --spring.profiles.active=prod)
#
# Variables requeridas:
#   DB_URL       jdbc:postgresql://aws-0-<region>.pooler.supabase.com:6543/postgres?sslmode=require
#   DB_USER      postgres.<project-ref>
#   DB_PASSWORD  contraseña de la base
#
# Opcionales:
#   CORS_ALLOWED_ORIGINS  orígenes separados por coma (default: https://notitas.vercel.app)
#   NOTITAS_JWT_SECRET    secreto JWT (recomendado fijar uno propio)
# ============================================================

# Puerto: Vercel Docker, Railway y Render inyectan la variable PORT y esperan
# que el contenedor escuche ahí. Spring Boot no enlaza PORT -> server.port de
# forma fiable por defecto, así que lo hacemos explícito.
server.port=${PORT:8080}

# Datasource PostgreSQL (Supabase)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driverClassName=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# La consola H2 nunca debe estar disponible en producción
spring.h2.console.enabled=false

# CORS: el origen del frontend desplegado en Vercel
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://notitas.vercel.app}

# JWT: OBLIGATORIO en producción. Sin fallback — la app no arranca sin él.
app.jwt.secret=${NOTITAS_JWT_SECRET}

# Almacenamiento de archivos: Supabase Storage (los hosts gratis tipo Render
# tienen disco efimero y perderian las portadas/adjuntos en cada reinicio).
# Requiere el bucket publico 'uploads' creado en Supabase (ver DEPLOY.md).
# Default: supabase (fail-fast si faltan SUPABASE_URL/SERVICE_ROLE_KEY).
# Si de verdad quieres disco local en prod, fija APP_STORAGE_PROVIDER=local.
app.storage.provider=${APP_STORAGE_PROVIDER:supabase}
app.supabase.url=${SUPABASE_URL}
app.supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY}
app.supabase.bucket=${SUPABASE_STORAGE_BUCKET:uploads}

# Cookies: HTTPS obligatorio en producción
app.cookie.secure=true

# Flyway: migraciones controladas en producción. Hibernate solo valida que el
# esquema coincida con las entidades; si hay diferencias, la app no arranca.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
