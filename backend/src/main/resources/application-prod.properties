# ============================================================
# Perfil de producción: PostgreSQL (Supabase) vía variables de entorno.
# Activar con: SPRING_PROFILES_ACTIVE=prod
#   (o -Dspring.profiles.active=prod, o --spring.profiles.active=prod)
#
# Variables requeridas:
#   DB_URL       jdbc:postgresql://aws-0-<region>.pooler.supabase.com:6543/postgres?sslmode=require
#   DB_USER      postgres.<project-ref>
#   DB_PASSWORD  contraseña de la base
#
# Opcionales:
#   CORS_ALLOWED_ORIGINS  orígenes separados por coma (default: https://notitas-cleo.vercel.app)
#   NOTITAS_JWT_SECRET    secreto JWT (recomendado fijar uno propio)
# ============================================================

# Puerto: Vercel Docker, Railway y Render inyectan la variable PORT y esperan
# que el contenedor escuche ahí. Spring Boot no enlaza PORT -> server.port de
# forma fiable por defecto, así que lo hacemos explícito.
server.port=${PORT:8080}

# Datasource PostgreSQL (Supabase)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driverClassName=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Optimización para Connection Pooler de Supabase (PgBouncer en modo transacción)
# Desactiva el cacheo de prepared statements en el driver para evitar errores con PgBouncer
spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# La consola H2 nunca debe estar disponible en producción
spring.h2.console.enabled=false

# CORS: único origen de producción del frontend en Vercel. Un origen
# ausente aquí recibe 403 en el preflight y todas sus peticiones fallan.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://notitas-cleo.vercel.app}

# JWT: Secreto configurable vía NOTITAS_JWT_SECRET
app.jwt.secret=${NOTITAS_JWT_SECRET:}

# Recuperación de contraseña (prod): email vía Resend y enlace apuntando al
# frontend desplegado. El enlace de reset NUNCA se expone en la respuesta.
app.frontend-url=${FRONTEND_URL:https://notitas-cleo.vercel.app}
app.email.provider=${APP_EMAIL_PROVIDER:resend}
app.email.resend.api-key=${RESEND_API_KEY:}
app.email.from=${APP_EMAIL_FROM:Notitas <onboarding@resend.dev>}
app.email.expose-reset-link=false

# Almacenamiento de archivos: Supabase Storage
app.storage.provider=${APP_STORAGE_PROVIDER:supabase}
app.supabase.url=${SUPABASE_URL:}
app.supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
app.supabase.bucket=${SUPABASE_STORAGE_BUCKET:uploads}

# Cookies: HTTPS obligatorio en producción
app.cookie.secure=true

# SameSite de la cookie JWT. Default None porque frontend (*.vercel.app) y API
# (onrender.com) son cross-site.
app.cookie.samesite=${COOKIE_SAMESITE:None}

# Flyway: migraciones controladas en producción.
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
