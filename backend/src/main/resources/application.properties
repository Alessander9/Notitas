spring.application.name=api

# Database Settings
spring.datasource.url=jdbc:h2:mem:notitasdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
# Flyway deshabilitado por defecto (se activa en el perfil prod)
spring.flyway.enabled=false
# SQL logging off: era ruido en consola y penalizaba el rendimiento
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 Console: deshabilitado por defecto; solo activar en profile "dev"
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Server configuration
server.port=8080

# File upload configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Custom application properties
# Secreto JWT: se lee SIEMPRE de la variable de entorno NOTITAS_JWT_SECRET.
# Sin valor por defecto en el repo: si no está definida (solo desarrollo local),
# JwtUtils genera una clave aleatoria por arranque — correcto porque H2 en
# memoria tampoco persiste. En producción (application-prod.properties) la app
# NO arranca sin ella.
app.jwt.secret=${NOTITAS_JWT_SECRET:}
app.jwt.expiration-ms=86400000
# Expiración de los JWT de sesiones "recordarme" (30 días por defecto)
app.jwt.remember-me-expiration-ms=2592000000
app.upload.dir=uploads

# Proveedor de almacenamiento de archivos: 'local' (disco, dev/tests) o
# 'supabase' (Supabase Storage, produccion). En prod se fija con la env var
# APP_STORAGE_PROVIDER=supabase.
app.storage.provider=local

# Orígenes permitidos por CORS (separados por coma). Se sobrescribe en el
# perfil prod con el dominio del frontend desplegado.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Cookie JWT: en prod se pone en true (requiere HTTPS)
app.cookie.secure=false

# SameSite de la cookie JWT. En dev (localhost) sobra con Lax; en prod cross-site
# (frontend en *.vercel.app, API en onrender.com) se necesita None. Si algún día
# frontend y API comparten dominio propio, fija COOKIE_SAMESITE=Lax (o Strict)
# para endurecer contra CSRF.
app.cookie.samesite=Lax

# Recuperación de contraseña
# URL base del frontend para construir el enlace de reset (se sobrescribe en
# prod con FRONTEND_URL).
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
# Vigencia de los tokens de recuperación (60 minutos)
app.password-reset.expiration-ms=3600000
# Proveedor de email transaccional: 'none' (dev/tests: no envía correos y expone
# el enlace de reset en la respuesta) o 'resend' (API REST, sin SMTP).
app.email.provider=${APP_EMAIL_PROVIDER:none}
app.email.resend.api-key=${RESEND_API_KEY:}
app.email.from=${APP_EMAIL_FROM:Notitas <onboarding@resend.dev>}
# Expone el enlace de reset en la respuesta cuando no hay email configurado.
# OCULTO por defecto también en dev: no se devuelve el enlace en la respuesta
# (seguridad). Los tests lo habilitan vía application-test.properties.
app.email.expose-reset-link=false

# Supabase Storage (solo si app.storage.provider=supabase)
#   SUPABASE_URL               p. ej. https://abcdefgh.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY  service_role key (solo server-side, NUNCA en el frontend)
#   SUPABASE_STORAGE_BUCKET    bucket publico donde se guardan los archivos (default: uploads)
app.supabase.url=
app.supabase.service-role-key=
app.supabase.bucket=uploads
