spring.application.name=api

# Database Settings
spring.datasource.url=jdbc:h2:mem:notitasdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
# Flyway deshabilitado por defecto (se activa en el perfil prod)
spring.flyway.enabled=false
# SQL logging off: era ruido en consola y penalizaba el rendimiento
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 Console: deshabilitado por defecto; solo activar en profile "dev"
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Server configuration
server.port=8080

# File upload configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Custom application properties
# El secreto JWT se puede sobrescribir con la variable de entorno NOTITAS_JWT_SECRET
app.jwt.secret=${NOTITAS_JWT_SECRET:5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437}
app.jwt.expiration-ms=86400000
app.upload.dir=uploads

# Proveedor de almacenamiento de archivos: 'local' (disco, dev/tests) o
# 'supabase' (Supabase Storage, produccion). En prod se fija con la env var
# APP_STORAGE_PROVIDER=supabase.
app.storage.provider=local

# Orígenes permitidos por CORS (separados por coma). Se sobrescribe en el
# perfil prod con el dominio del frontend desplegado.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Cookie JWT: en prod se pone en true (requiere HTTPS)
app.cookie.secure=false

# Supabase Storage (solo si app.storage.provider=supabase)
#   SUPABASE_URL               p. ej. https://abcdefgh.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY  service_role key (solo server-side, NUNCA en el frontend)
#   SUPABASE_STORAGE_BUCKET    bucket publico donde se guardan los archivos (default: uploads)
app.supabase.url=
app.supabase.service-role-key=
app.supabase.bucket=uploads
