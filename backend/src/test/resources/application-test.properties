# Perfil "test": desactiva el rate limit de login/register porque los tests de
# integracion hacen decenas de peticiones de auth en pocos segundos. El resto
# de la configuracion hereda de application.properties (perfil por defecto).
app.rate-limit.enabled=false

# Los tests de recuperación (PasswordResetIntegrationTest) prueban el flujo
# completo sin email configurado, así que aquí SÍ se expone el enlace de reset
# en la respuesta. En dev y prod está oculto (app.email.expose-reset-link=false).
app.email.expose-reset-link=true
