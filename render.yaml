# Render Blueprint — backend Notitas (API Spring Boot) en el plan GRATIS.
#
# Cómo usarlo:
#   1. Sube el repo a GitHub.
#   2. En render.com: New → Blueprint → conéctalo al repo.
#   3. Render detecta este render.yaml y crea el servicio.
#   4. Rellena los secretos (sync: false) que te pide:
#        DB_URL, DB_USER, DB_PASSWORD   → Supabase (connection pooler)
#        SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY → Supabase Storage
#        NOTITAS_JWT_SECRET             → genera uno con:
#            node -e "console.log(require('crypto').randomBytes(48).toString('base64'))"
#
# Notas del plan free: el servicio se duerme tras ~15 min sin tráfico y tarda
# ~1 min en despertar. Mantenerlo despierto con monitores externos gratuitos:
# - UptimeRobot: GET /api/public/ping cada 5 minutos.
# - cron-job.org: GET /api/public/ping cada 10 minutos como respaldo.
# Render Blueprint — backend Notitas (API Node.js + Cloudinary) en el plan GRATIS.
services:
  - type: web
    name: notitas-api
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /api/public/ping
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ALLOWED_ORIGINS
        value: https://notitas-cleo.vercel.app,https://notitas-alessander.vercel.app
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: NOTITAS_JWT_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        value: "128275187432123"
      - key: CLOUDINARY_API_SECRET
        value: "jU1f3sewX5jHoBZKCPQB47Z9oY8"
      - key: RESEND_API_KEY
        sync: false

