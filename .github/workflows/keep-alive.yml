name: Keep Render Alive

on:
  schedule:
    # Corre cada 10 minutos
    - cron: '*/10 * * * *'
  workflow_dispatch: # Permite activarlo de forma manual desde el panel de GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          curl -I -s -o /dev/null -w "Status Code: %{http_code}\n" https://notitas-api.onrender.com/api/public/health
