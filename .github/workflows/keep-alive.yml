name: Keep Render Alive

on:
  schedule:
    # Corre cada 5 minutos para que Render no se duerma
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          curl -s -S -o /dev/null -w "Status Code: %{http_code}\n" https://notitas-api.onrender.com/api/public/ping

